<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Groups — SplitSmart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="main-area">
    <header class="topbar" id="topbar"></header>
    <main class="page-content">

      <div class="section-head">
        <h2 style="font-size:1.4rem;">Your Groups</h2>
        <button class="btn btn-primary" id="openCreateGroupBtn">+ Create Group</button>
      </div>

      <div class="card empty-state" id="groupsEmptyState" style="display:none;">
        <div class="empty-icon">🗂️</div>
        <h3>No groups yet</h3>
        <p>Create a group for your next trip, your flat-share, or any set of shared expenses.</p>
        <button class="btn btn-primary" onclick="openCreateGroupModal()">Create Your First Group</button>
      </div>

      <div class="groups-grid" id="groupsGrid"></div>

    </main>
  </div>
</div>

<!-- Create/Edit Group Modal -->
<div class="modal-overlay" id="createGroupModal" aria-hidden="true">
  <div class="modal-box modal-lg" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h3 id="groupModalTitle">Create New Group</h3>
      <button type="button" class="modal-close" onclick="closeModal('createGroupModal')" aria-label="Close group form">&times;</button>
    </div>
    <form id="createGroupForm">
      <div class="field">
        <label for="groupNameInput">Group name</label>
        <input type="text" id="groupNameInput" placeholder="e.g. Goa Vacation" maxlength="60" required>
        <div class="error-msg"></div>
      </div>
      <div class="field">
        <label for="groupDescInput">Description <span class="hint">(optional)</span></label>
        <textarea id="groupDescInput" placeholder="What's this group for?"></textarea>
      </div>
      <div class="field">
        <label>Members</label>
        <div style="display:flex;gap:10px;">
          <input type="text" id="tempMemberInput" placeholder="Type a member name and press Enter" maxlength="50">
          <button type="button" class="btn btn-ghost" id="addTempMemberBtn">Add</button>
        </div>
        <div class="member-select-grid" id="tempMembersList" style="margin-top:14px;"></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="closeModal('createGroupModal')">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Group</button>
      </div>
    </form>
  </div>
</div>

<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/settlement.js"></script>
<script src="js/groups.js"></script>
<script src="js/app.js"></script>
<script src="js/enhancements.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    initShell('groups', 'Groups');
    initGroupsPage();
  });
</script>
</body>
</html>
